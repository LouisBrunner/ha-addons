# yaml-language-server: $schema=https://schemas.lbrunner.net/home-assistant/addon-config.schema.json
name: "Glance"
description: "Self-hosted customizable dashboard with OIDC-only login"
version: "0.0.1"
slug: "glance"
# image: ghcr.io/louisbrunner/ha-glance
url: "https://github.com/LouisBrunner/ha-addons/blob/main/glance"
init: false
arch:
  - aarch64
  - amd64
options:
  hostname: ""
  oidc:
    issuer: ""
    client_id: ""
    client_secret: ""
    provider_name: ""
  debug: false
schema:
  hostname: "match(^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$)"
  oidc:
    issuer: url
    client_id: str
    client_secret: password
    provider_name: str?
  debug: bool?
ports:
  3000/tcp: null
