# yaml-language-server: $schema=https://schemas.lbrunner.net/home-assistant/addon-config.schema.json
name: "Zot"
description: "Self-hosted OCI/Docker container registry with a web UI (Zot + ZUI)"
version: "0.0.1"
slug: "zot"
url: "https://github.com/LouisBrunner/ha-addons/blob/main/zot"
image: ghcr.io/louisbrunner/ha-zot
init: false
arch:
  - aarch64
  - amd64
backup_exclude:
  - "**/registry/**/blobs/**"
  - "**/registry/**/.uploads/**"
  - "**/registry/**/index.json"
  - "**/registry/**/oci-layout"
  - "**/registry/_trivy/**"
  - "**/registry/_sessions/**"
options:
  external_url: ""
  blob_upload_timeout: 2m
  oidc:
    issuer: ""
    client_id: ""
    client_secret: ""
    provider_name: ""
    username_claim: "email"
    admin_identities: []
    admin_groups: []
  anonymous_read: false
  readonly_groups: []
  readonly_identities: []
  repositories: []
  storage:
    gc: true
    gc_delay: 1h
    dedupe: true
    retention:
      enabled: false
      delay: 24h
      policies: []
  metrics_enabled: false
  cve:
    enabled: true
    update_interval: 24h
  rate_limit:
    enabled: true
    requests_per_second: 100
    per_method: []
  webhooks: []
  lint:
    enabled: false
    mandatory_annotations: []
  scrub:
    enabled: false
    interval: 24h
  sync: []
  debug: false
schema:
  external_url: str
  blob_upload_timeout: str?
  oidc:
    issuer: str
    client_id: str
    client_secret: password
    provider_name: str?
    username_claim: str?
    admin_identities:
      - str
    admin_groups:
      - str
  anonymous_read: bool?
  readonly_groups:
    - str
  readonly_identities:
    - str
  repositories:
    - pattern: str
      readonly_identities:
        - str
      readonly_groups:
        - str
      anonymous_read: bool?
  storage:
    gc: bool?
    gc_delay: str?
    dedupe: bool?
    retention:
      enabled: bool?
      delay: str?
      policies:
        - repositories:
            - str
          delete_referrers: bool?
          delete_untagged: bool?
          keep_tags:
            - patterns:
                - str
              pulled_within: str?
              pushed_within: str?
              most_recently_pushed_count: int?
  metrics_enabled: bool?
  cve:
    enabled: bool?
    update_interval: str?
  rate_limit:
    enabled: bool?
    requests_per_second: int?
    per_method:
      - method: str
        requests_per_second: int
  webhooks:
    - url: str
      username: str?
      password: password?
      token: password?
  lint:
    enabled: bool?
    mandatory_annotations:
      - str
  scrub:
    enabled: bool?
    interval: str?
  sync:
    - url: str
      on_demand: bool?
      poll_interval: str?
      content_prefix: str?
      content_destination: str?
      username: str?
      password: password?
  debug: bool?
ports:
  5000/tcp: null
