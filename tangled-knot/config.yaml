# yaml-language-server: $schema=https://schemas.lbrunner.net/home-assistant/addon-config.schema.json
name: "Tangled Knot"
description: "Self-hosted Tangled knot server for git repository hosting on the AT Protocol"
version: "0.0.1"
slug: "tangled-knot"
url: "https://github.com/LouisBrunner/ha-addons/blob/main/tangled-knot"
# image: ghcr.io/louisbrunner/ha-tangled-knot
init: false
arch:
  - aarch64
  - amd64
options:
  hostname: ""
  owner_did: ""
schema:
  hostname: "match(^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$)"
  owner_did: "match(^did:[a-z0-9]+:.+$)"
ports:
  5555/tcp: null
  22/tcp: 2525
